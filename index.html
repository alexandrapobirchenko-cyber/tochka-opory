<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Точка опоры — самопомощь в трудных ситуациях: разбор с вопросами, цветовой тест, дневник самочувствия и практики саморегуляции.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E4A6D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Точка опоры">
<title>Точка опоры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F2; --surface:#FFFFFF; --ink:#1B2631; --muted:#5A6672; --line:#D3D9DE;
  --accent:#1E4A6D; --accent-ink:#FFFFFF; --sage:#2E6A5A; --soft:#E2E9EE; --warn:#9A3B22;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161B; --surface:#182028; --ink:#E4E9ED; --muted:#99A5B0; --line:#2A343E;
    --accent:#86B4DA; --accent-ink:#0E1A24; --sage:#7DBBA7; --soft:#1F2A34; --warn:#E59A7F;
  }
}
:root[data-theme="dark"]{
  --paper:#11161B; --surface:#182028; --ink:#E4E9ED; --muted:#99A5B0; --line:#2A343E;
  --accent:#86B4DA; --accent-ink:#0E1A24; --sage:#7DBBA7; --soft:#1F2A34; --warn:#E59A7F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 26px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-weight:600;font-size:1.2rem;letter-spacing:.01em}
.mark{display:grid;grid-template-columns:repeat(4,7px);grid-template-rows:repeat(2,7px);gap:2px}
.mark i{display:block;border-radius:1.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:var(--muted);display:flex;align-items:center;gap:10px}
.nav button:hover{color:var(--ink);background:var(--soft)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--soft);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.side .who{margin-top:auto;font-size:.88rem;color:var(--muted);padding:0 8px}
.side .who button{all:unset;cursor:pointer;color:var(--accent);margin-top:4px}
main{padding:40px 40px 80px;min-width:0}
.wrap{max-width:760px;margin:0 auto}
.tabbar{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:22px 18px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 6px;min-width:56px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  h1{font-size:1.6rem}
}

/* elements */
.lede{color:var(--muted);font-size:1.02rem;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 16px}
.panel.flat{background:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:9px;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:block;font-weight:500;margin:14px 0 6px}
.hint{color:var(--muted);font-size:.9rem;margin:-2px 0 8px}
input[type=text],input[type=password],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.val{font-family:var(--serif);font-size:1.6rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:.92rem;z-index:50;max-width:90vw}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center}

/* signature strip */
.strip{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:0 0 22px}
.strip i{flex:1}

/* home */
.hello{margin-bottom:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:500}
.stat span{color:var(--muted);font-size:.86rem}
.task{border-left:4px solid var(--sage)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;padding:12px 2px;box-sizing:border-box}
.list button:hover .t{color:var(--accent)}
.list .d{color:var(--muted);font-size:.86rem;white-space:nowrap}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:10px;height:14px;border-radius:2px;display:block}

/* wizard */
.steps{display:flex;gap:4px;margin:0 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.stepname{color:var(--muted);font-size:.9rem;margin-bottom:4px}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.practice{background:var(--soft);border-radius:12px;padding:18px;margin:12px 0}
.practice ol{margin:.4em 0 0;padding-left:1.2em}
.practice li{margin:.3em 0}
.tabs{display:flex;gap:6px;margin:10px 0}

/* colour test */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:520px;margin:18px auto}
.sw{aspect-ratio:1;border-radius:14px;border:0;cursor:pointer;transition:transform .12s}
.sw:hover{transform:scale(1.03)}
.sw.gone{visibility:hidden}
.picked{display:flex;gap:6px;justify-content:center;min-height:30px;margin-top:6px}
.picked i{width:26px;height:26px;border-radius:6px;display:block}
.probe-count{text-align:center;color:var(--muted);font-size:.9rem}
.order{display:flex;gap:4px;margin:8px 0}
.order div{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.order div i{display:block;height:34px;border-radius:6px;margin-bottom:3px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.bars .b{display:grid;grid-template-columns:170px 1fr 36px;gap:10px;align-items:center;margin:7px 0;font-size:.92rem}
@media (max-width:620px){.bars .b{grid-template-columns:110px 1fr 30px}}
.bars .b.max .meter i{background:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}

/* practices */
details.m{border-top:1px solid var(--line);padding:12px 0}
details.m summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.m summary::-webkit-details-marker{display:none}
details.m summary .code{color:var(--muted);font-size:.86rem;white-space:nowrap}
details.m[open] summary{margin-bottom:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:.94rem}
@media (max-width:620px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.timer{font-family:var(--serif);font-size:2.4rem;text-align:center;margin:8px 0}

/* auth */
.auth{max-width:440px;margin:8vh auto;padding:0 18px}
.auth .strip{height:10px}
.modal{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal .panel{max-width:440px;width:100%;margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>

  full:[

    {t:"Здоровье",i:"Подумайте о своём здоровье. Если есть телесный дискомфорт — где он, как ощущается? Побудьте с этим несколько секунд и из этого состояния снова выберите цвета."},

    {t:"Опора и поддержка",i:"Подумайте, насколько вы чувствуете поддержку — от людей, сообщества, организаций. Есть ли, на кого опереться? Затем выберите цвета."}

};
const MER={
  P:{n:"Меридиан лёгких",time:"3:00–5:00",feel:"Сдержанная агрессия, напряжение, которому некуда деться; тревога с ощущением нехватки воздуха.",body:"Грудь и дыхание, горло, надключичная ямка, плечо; ночные пробуждения, потливость, кожные проявления.",move:"Рука вытянута вперёд. Поднимайте локоть вверх."},
  GI:{n:"Меридиан толстого кишечника",time:"5:00–7:00",feel:"Желание избежать ситуации, увернуться от человека или обстоятельств.",body:"Сжатые челюсти, зубы, горло, напряжение шеи и затылка, суставы рук, кишечник, вздутие.",move:"Сидя на стуле с прямой спиной, уведите корпус в сторону — «увернуться». Дополнительно можно массировать точку «пасть льва» между большим и указательным пальцами."},
  E:{n:"Меридиан желудка",time:"7:00–9:00",feel:"Гнев, злость, «не перевариваю» — человека или ситуацию.",body:"Верх живота, желудок, челюсти, лицо, голова, горло, межрёберье, колени.",move:"Прямая рука вытянута вперёд. Резкое движение по диагонали вверх — как «пощёчина»."},
  RP:{n:"Меридиан селезёнки и поджелудочной железы",time:"9:00–11:00",feel:"Накопившееся раздражение, которое хочется выплеснуть: «Вот вам!»",body:"Область под ложечкой, подреберье, аппетит, сон, отёчность ног, внутренняя сторона ноги.",move:"Рука согнута в локте, локоть смотрит вперёд. Резко выпрямите руку — «Вот вам!»"},

  IG:{n:"Меридиан тонкого кишечника",time:"13:00–15:00",feel:"Страх и тревога, от которых хочется убежать, уклониться, защититься.",body:"Низ живота и область пупка, лопатка, шея, затылок, лицо, слух.",move:"Сидя на стуле, увернитесь: наклон с поворотом, плечом к колену по диагонали."},
  V:{n:"Меридиан мочевого пузыря",time:"15:00–17:00",feel:"Давление со стороны людей или обстоятельств.",body:"Поясница, позвоночник, таз, задняя поверхность ног, пятка, темя.",move:"Стоя спиной к стене, толкайте стену, как будто отодвигаете давление. Мягкий вариант — «кошка-корова»."},
  R:{n:"Меридиан почек",time:"17:00–19:00",feel:"Ситуация давит и наваливается, хочется от неё уклониться; усталость, страхи.",body:"Поясница, отёки, давление, мочевыделение, уши, стопы; упадок сил.",move:"Уворачивайтесь, поднимая плечо к уху, — как будто уходите от того, что давит."},

  VB:{n:"Меридиан желчного пузыря",time:"23:00–1:00",feel:"Агрессия и сопротивление агрессии, «едкое» раздражение.",body:"Висок, затылок, задняя часть шеи, мигрени, правый бок, горечь во рту.",move:"Прямая рука «семафором»: из положения вперёд — вверх."},

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c};
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function mini(order){return `<span class="mini" aria-hidden="true">${order.map(c=>`<i style="background:${LUSCHER[c].hex}"></i>`).join("")}</span>`}
function strip(h){return `<div class="strip" aria-hidden="true"${h?` style="height:${h}px"`:""}>${STRIP.map(c=>`<i style="background:${LUSCHER[c].hex}"></i>`).join("")}</div>`}
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return "x"+h}}
function ask(msg,opts){opts=opts||{};return new Promise(res=>{
  const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  m.innerHTML=`<div class="panel"><p>${esc(msg)}</p>${opts.input?`<textarea id="ask-in" placeholder="${esc(opts.placeholder||"")}"></textarea>`:""}<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn quiet" data-k="no">Отмена</button><button class="btn ${opts.danger?"danger":""}" data-k="yes">${esc(opts.ok||"Да")}</button></div></div>`;
  const done=v=>{m.remove();res(v)};
  m.addEventListener("click",e=>{e.stopPropagation();const k=e.target.dataset&&e.target.dataset.k;if(k==="yes")done(opts.input?(m.querySelector("#ask-in").value||""):true);else if(k==="no"||e.target===m)done(opts.input?null:false)});
  m.addEventListener("keydown",e=>{if(e.key==="Escape")done(opts.input?null:false)});
  document.body.appendChild(m);(m.querySelector("#ask-in")||m.querySelector('[data-k="yes"]')).focus();
})}

/* ---------- анализ цветового выбора ---------- */
function analyze(order){
  const pos={};order.forEach((c,i)=>pos[c]=i+1);
  let so=0;for(const c of order)so+=Math.abs(pos[c]-(NORM.indexOf(c)+1));
  let anx=0;
  for(const c of [1,2,3,4]){const p=pos[c];if(p===6)anx+=1;if(p===7)anx+=2;if(p===8)anx+=3}
  for(const c of [0,6,7]){const p=pos[c];if(p===3)anx+=1;if(p===2)anx+=2;if(p===1)anx+=3}
  const vk=(18-pos[3]-pos[4])/(18-pos[1]-pos[2]);
  return {so,anx,vk:Math.round(vk*100)/100};
}

const Store={
  async load(){
    if(S.mode==="cloud"){
      const base=S.db.doc(`data/users/${S.uid}/profile`);
      const [p,...cols]=await Promise.all([base.get(),...KINDS.map(k=>base.collection(k).get())]);
      if(p.exists)S.profile=Object.assign({code:""},p.data());
      KINDS.forEach((k,i)=>S.data[k]=cols[i].docs.map(d=>d.data()));
    }else{
      KINDS.forEach(k=>S.data[k]=LS.get(`tochka:${S.pid}:${k}`,[]));
      S.profile=LS.get(`tochka:${S.pid}:profile`,{code:""});
    }
    KINDS.forEach(k=>S.data[k].sort((a,b)=>b.createdAt-a.createdAt));
  },
  async put(kind,obj){
    const arr=S.data[kind];const i=arr.findIndex(x=>x.id===obj.id);
    if(i>=0)arr[i]=obj;else arr.unshift(obj);
    arr.sort((a,b)=>b.createdAt-a.createdAt);
    try{
      if(S.mode==="cloud")await S.db.doc(`data/users/${S.uid}/profile`).collection(kind).doc(obj.id).set(obj);
      else if(!LS.set(`tochka:${S.pid}:${kind}`,arr))throw new Error("ls");
    }catch(e){toast("Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.")}
  },
  async del(kind,id){
    S.data[kind]=S.data[kind].filter(x=>x.id!==id);
    try{
      if(S.mode==="cloud")await S.db.doc(`data/users/${S.uid}/profile`).collection(kind).doc(id).delete();
      else LS.set(`tochka:${S.pid}:${kind}`,S.data[kind]);
    }catch(e){toast("Не удалось удалить запись.")}
  },
  async saveProfile(){
    try{
      if(S.mode==="cloud")await S.db.doc(`data/users/${S.uid}/profile`).set(S.profile);
      else LS.set(`tochka:${S.pid}:profile`,S.profile);
    }catch(e){toast("Не удалось сохранить профиль.")}
  },
  async wipe(){
    for(const k of KINDS)for(const x of [...S.data[k]])await Store.del(k,x.id);
  }
};

  return h;
}

async function ctPick(c){
  const ct=S.ct;if(ct.cur.includes(c))return;ct.cur.push(c);
  if(ct.cur.length===8){
    ct.results.push({title:PROBES[ct.mode][ct.idx].t,order:[...ct.cur],res:analyze(ct.cur)});

      const t={id:uid(),createdAt:Date.now(),mode:ct.mode,code:S.profile.code||"",probes:ct.results};

  render();

  if(t.probes.length>1){

    const worst=t.probes.slice(1).filter(p=>p.res.so===max).map(p=>"«"+p.title+"»");
    h+=`<section class="panel"><h3>Как меняется состояние по сферам</h3>
    <p class="small muted">Чем длиннее полоса, тем сильнее выбор отклоняется от спокойного состояния, когда вы думаете об этой сфере.</p>
    <div class="bars">${t.probes.map(p=>`<div class="b ${p.res.so===max&&p!==p0?"max":""}"><span>${esc(p.title)}</span><div class="meter"><i style="width:${Math.min(100,p.res.so/32*100)}%"></i></div><span>${p.res.so}</span></div>`).join("")}</div>
    <p style="margin-top:12px">Сильнее всего состояние меняется, когда вы думаете ${worst.length>1?"о сферах":"о сфере"} ${esc(worst.join(", "))}. С неё, возможно, стоит начать разбор ситуации.</p>
    <div class="scroll"><table class="t"><tr><th>Проба</th><th>Порядок</th><th>СО</th><th>Трев.</th><th>ВК</th></tr>
    ${t.probes.map(p=>`<tr><td>${esc(p.title)}</td><td>${mini(p.order)}</td><td>${p.res.so}</td><td>${p.res.anx}</td><td>${p.res.vk}</td></tr>`).join("")}</table></div></section>`;
  }
  const prev=S.data.tests.filter(x=>x.createdAt<t.createdAt)[0];
  if(prev){const d=r.so-prev.probes[0].res.so;h+=`<p class="muted">По сравнению с тестом от ${fmtD(prev.createdAt)}: отклонение ${d<0?"уменьшилось на "+(-d):d>0?"выросло на "+d:"не изменилось"}.</p>`}
  h+=`<div class="row"><button class="btn" data-go="wizard" data-a="newWiz">Разобрать ситуацию</button><button class="btn danger small" data-a="delTest" data-id="${t.id}">Удалить</button></div>`;
  return h;
}
function testsCSV(){
  const head=["Код","Дата","Тип","Проба","П1","П2","П3","П4","П5","П6","П7","П8","СО","Тревожность","ВК"];
  const rows=[head];
  [...S.data.tests].reverse().forEach(t=>t.probes.forEach(p=>rows.push([t.code||S.profile.code||"",new Date(t.createdAt).toLocaleString("ru-RU"),t.mode==="full"?"полный":"быстрый",p.title,...p.order,p.res.so,p.res.anx,String(p.res.vk).replace(".",",")])));
  return "\uFEFF"+rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(";")).join("\r\n");
}
async function download(name,data){
  if(window.claude&&window.claude.use){
    const dl=await window.claude.use("downloads");
    if(!dl){toast("Скачивание недоступно в этом окне.");return}
    try{await dl.save({filename:name,data})}catch(e){if(e&&e.code!=="declined")toast("Не удалось сохранить файл.")}
    return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- дневник ---------- */
function epChart(eps){
  const days=14,now=new Date();now.setHours(0,0,0,0);
  const cnt=Array(days).fill(0);
  eps.forEach(e=>{const d=new Date(e.createdAt);d.setHours(0,0,0,0);const i=days-1-Math.round((now-d)/DAY);if(i>=0&&i<days)cnt[i]++});
  const mx=Math.max(3,...cnt),W=680,H=130,bw=W/days;
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Эпизоды за 14 дней">
  ${cnt.map((c,i)=>`<rect x="${i*bw+4}" y="${H-c/mx*H}" width="${bw-8}" height="${c/mx*H}" rx="3" fill="var(--sage)"/>${c?`<text x="${i*bw+bw/2}" y="${H-c/mx*H-4}" font-size="13" text-anchor="middle" fill="var(--muted)">${c}</text>`:""}`).join("")}
  <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
  <text x="2" y="${H+15}" font-size="13" fill="var(--muted)">14 дней назад</text><text x="${W-2}" y="${H+15}" font-size="13" fill="var(--muted)" text-anchor="end">сегодня</text></svg></div>`;
}
function wbChart(notes){
  const days=14,now=new Date();now.setHours(0,0,0,0);
  const sum=Array(days).fill(0),n=Array(days).fill(0);
  notes.forEach(e=>{if(e.wellbeing==null)return;const d=new Date(e.createdAt);d.setHours(0,0,0,0);const i=days-1-Math.round((now-d)/DAY);if(i>=0&&i<days){sum[i]+=e.wellbeing;n[i]++}});
  const W=680,H=130,bw=W/days;
  const pts=sum.map((s,i)=>n[i]?[i*bw+bw/2,H-(s/n[i])/10*H]:null);
  const path=pts.filter(Boolean).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Самочувствие за 14 дней">
  <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
  ${path?`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>`:""}
  ${pts.map(p=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)"/>`:"").join("")}
  <text x="2" y="${H+15}" font-size="13" fill="var(--muted)">14 дней назад</text><text x="${W-2}" y="${H+15}" font-size="13" fill="var(--muted)" text-anchor="end">сегодня</text></svg></div>`;
}

let rxTimer=null;
function relaxStart(){S.relax={i:0,phase:"tense",left:5};render()}
function relaxStop(){clearInterval(rxTimer);rxTimer=null;S.relax=null;render()}
function tickRelax(fresh){
  if(rxTimer&&fresh)return;clearInterval(rxTimer);
  rxTimer=setInterval(()=>{
    const r=S.relax;if(!r||S.view!=="practices"){clearInterval(rxTimer);rxTimer=null;return}
    r.left--;
    if(r.left<=0){
      if(r.phase==="tense"){r.phase="relax";r.left=12}
      else if(r.i+1<RELAX.length){r.i++;r.phase="tense";r.left=5}
      else{clearInterval(rxTimer);rxTimer=null;S.relax=null;toast("Релаксация завершена. Побудьте в этом состоянии ещё немного.");render();return}
      clearInterval(rxTimer);rxTimer=null;render();return;
    }
    const el=document.getElementById("rx-t");if(el)el.textContent=r.left;
  },1000);
}

  if(a==="newWiz")newWiz();

  const w=S.wiz;
  switch(a){
    case "register":return doRegister();
    case "login":return doLogin();
    case "toLogin":S.authReg=false;return render();
    case "toReg":S.authReg=true;return render();
    case "logout":return logout();
    case "sphere":w.sphere=w.sphere===v?"":v;return render();
    case "zone":w.zones=w.zones.includes(v)?w.zones.filter(x=>x!==v):[...w.zones,v];w.zone="";return render();
    case "sens":w.sens=w.sens.includes(v)?w.sens.filter(x=>x!==v):[...w.sens,v];return render();

      if(w.step===3&&!w.emotion){toast("Выберите вариант, который ближе.");return}
      w.step++;render();window.scrollTo(0,0);return;
    case "wprev":w.step--;render();window.scrollTo(0,0);return;
    case "wsave":return saveWiz();

    case "closeTask":{const s=S.data.sessions.find(x=>x.id===id);const refl=await ask("Что изменилось за это время? Пришло ли новое понимание?",{input:1,ok:"Завершить задание",placeholder:"Например: дискомфорт стал реже, поняла, что…"});if(refl===null)return;s.homework={closed:true,closedAt:Date.now(),reflection:refl.trim()};await Store.put("sessions",s);toast("Задание завершено. Пройдите цветовой тест ещё раз, чтобы сравнить.");return go("color")}
    case "quickEp":S.diaryType="episode";{const s=S.data.sessions.find(x=>x.id===id);S.df={zones:s?[...s.zones]:[],wellbeing:6,before:s?s.before:5,after:3,done:true}}return go("diary");
    case "dtype":S.diaryType=v;return render();
    case "dzone":{const df=S.df;df.zones=df.zones.includes(v)?df.zones.filter(x=>x!==v):[...df.zones,v];const keep=captureDiary();render();restoreDiary(keep);return}
    case "saveNote":return saveNote();
    case "delNote":if(await ask("Удалить запись?",{ok:"Удалить",danger:1})){await Store.del("notes",id);render()}return;
    case "relaxStart":return relaxStart();
    case "relaxStop":return relaxStop();
    case "saveCode":S.profile.code=document.getElementById("p-code").value.trim();await Store.saveProfile();return toast("Код сохранён.");
    case "wipe":if(await ask("Удалить все разборы, тесты и записи дневника? Это действие нельзя отменить.",{ok:"Удалить всё",danger:1})){await Store.wipe();toast("Все записи удалены.");go("home")}return;
  }
});
function captureDiary(){const o={};["d-sit","d-text","d-sleep"].forEach(k=>{const el=document.getElementById(k);if(el)o[k]=el.value});const c=document.getElementById("d-done");if(c)o.done=c.checked;return o}
function restoreDiary(o){for(const k in o){const el=document.getElementById(k);if(!el)continue;if(k==="done")el.checked=o[k];else el.value=o[k]}}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.bind&&S.wiz){const k=el.dataset.bind;S.wiz[k]=el.dataset.num?+el.value:el.value;const o=document.getElementById("v-"+k);if(o)o.textContent=el.value}
  if(el.dataset.dbind&&S.df){const k=el.dataset.dbind;S.df[k]=+el.value;const o=document.getElementById({before:"v-dbefore",after:"v-dafter",wellbeing:"v-dwb"}[k]);if(o)o.textContent=el.value}
  if(el.id==="d-done"&&S.df)S.df.done=el.checked;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!S.mode&&e.target.tagName==="INPUT"){const b=document.querySelector('[data-a="login"],[data-a="register"]');if(b)b.click()}
});

/* ---------- запуск ---------- */
async function boot(){
  S.booting=true;render();
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  }
  if(db&&user){
    const me=await user.me();
    if(me&&me.id){
      S.mode="cloud";S.db=db;S.uid=me.id;S.userName=me.name||"";
      try{await Store.load()}catch(e){toast("Не удалось загрузить записи. Обновите страницу.")}
      S.booting=false;render();return;
    }
  }
  S.booting=false;
  let act=null;try{act=sessionStorage.getItem("tochka:active")}catch(e){}
  const p=act&&LS.get("tochka:profiles",[]).find(x=>x.id===act);
  if(p){await enterLocal(p);return}
  render();
}
boot();
</script>
