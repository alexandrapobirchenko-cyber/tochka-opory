<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Точка опоры — самопомощь в трудных ситуациях: разбор с вопросами, цветовой тест, дневник самочувствия и практики саморегуляции.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2E8DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15100E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Точка опоры">
<title>Точка опоры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2E8DA; --surface:#FBF6EE; --raised:#FFFDF9; --ink:#1B1614; --muted:#76685D; --line:#E3D5C2; --soft:#ECDFCC;
  --accent:#B8221A; --accent-hi:#C92D23; --accent-ink:#FBF3E8; --accent-soft:#F3DDD3;
  --shadow-sm:0 1px 2px rgba(74,38,20,.06),0 3px 10px -6px rgba(74,38,20,.16);
  --shadow:0 1px 2px rgba(74,38,20,.05),0 16px 38px -24px rgba(74,38,20,.38);
  --shadow-lg:0 28px 70px -30px rgba(74,38,20,.5);
  --ease:cubic-bezier(.22,.8,.26,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Golos Text", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100E; --surface:#1F1815; --raised:#271F1B; --ink:#F2E6D6; --muted:#A99A8B; --line:#3A2E27; --soft:#2C221D;
    --accent:#E04A3C; --accent-hi:#EA5D4F; --accent-ink:#1A0E0B; --accent-soft:#3B201B;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 18px 40px -24px rgba(0,0,0,.7); --shadow-lg:0 28px 70px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15100E; --surface:#1F1815; --raised:#271F1B; --ink:#F2E6D6; --muted:#A99A8B; --line:#3A2E27; --soft:#2C221D;
  --accent:#E04A3C; --accent-hi:#EA5D4F; --accent-ink:#1A0E0B; --accent-soft:#3B201B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 18px 40px -24px rgba(0,0,0,.7); --shadow-lg:0 28px 70px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
#root{height:100%}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.18;margin:0 0 .5em;letter-spacing:-.005em}
h1{font-size:clamp(1.7rem,3.6vw,2.2rem)} h2{font-size:1.4rem} h3{font-size:1.12rem}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-soft)}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:30px 18px 26px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin:0 8px 30px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-weight:600;font-size:1.18rem}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:11px 14px;border-radius:14px;color:var(--muted);display:flex;align-items:center;gap:12px;transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--spring)}
.nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.nav button:active{transform:scale(.97)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-sm)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.side .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;cursor:pointer;background:none;border:0;text-align:left;color:var(--ink);transition:background .25s var(--ease)}
.side .who:hover{background:var(--surface)}
.side .who small{display:block;color:var(--muted);font-size:.82rem}
.ava{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-size:1rem;flex:none}
main{padding:52px 48px 64px;min-width:0}
.wrap{max-width:720px;margin:0 auto}
.tabbar{display:none}
.topava{display:none}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:22px 20px calc(100px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around;padding:6px;border-radius:22px;
    background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--shadow-lg);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);padding:6px 4px;min-width:56px;border-radius:14px;transition:color .25s,transform .2s var(--spring),background .25s}
  .tabbar button:active{transform:scale(.92)}
  .tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .tabbar svg{width:22px;height:22px}
  .topava{display:grid;border:0;cursor:pointer}
}

/* transitions */
@keyframes in-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes in-fwd{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes in-back{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.anim-fade{animation:in-fade .46s var(--ease) both}
.anim-fwd{animation:in-fwd .44s var(--ease) both}
.anim-back{animation:in-back .44s var(--ease) both}
.wrap.leave-fade,.wrap.leave-fwd,.wrap.leave-back{transition:opacity .16s ease,transform .16s ease;opacity:0}
.wrap.leave-fade{transform:translateY(-6px)}
.wrap.leave-fwd{transform:translateX(-22px)}
.wrap.leave-back{transform:translateX(22px)}
.anim-fade .stagger>*{animation:in-fade .5s var(--ease) both}
.anim-fade .stagger>*:nth-child(2){animation-delay:.05s}
.anim-fade .stagger>*:nth-child(3){animation-delay:.1s}
.anim-fade .stagger>*:nth-child(4){animation-delay:.15s}
.anim-fade .stagger>*:nth-child(5){animation-delay:.2s}
.anim-fade .stagger>*:nth-child(n+6){animation-delay:.24s}

/* elements */
.lede{color:var(--muted);font-size:1.03rem;max-width:60ch}
.panel{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:24px;padding:24px;margin:0 0 16px;box-shadow:var(--shadow)}
.panel.flat{background:transparent;box-shadow:none;border-color:transparent;padding-left:4px;padding-right:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.panel{margin:0}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{cursor:pointer;border:0;background:var(--accent);color:var(--accent-ink);padding:13px 24px;border-radius:999px;font-weight:500;line-height:1.2;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 22px -12px color-mix(in srgb,var(--accent) 80%,transparent);
  transition:transform .22s var(--spring),background .25s var(--ease),box-shadow .25s var(--ease),opacity .2s}
.btn:hover{background:var(--accent-hi)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.quiet{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.btn.quiet:hover{background:var(--surface)}
.btn.link{background:none;box-shadow:none;color:var(--muted);padding:10px 6px}
.btn.link:hover{color:var(--ink)}
.btn.small{padding:8px 16px;font-size:.9rem}
.btn.danger{background:transparent;color:var(--accent);box-shadow:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.btn[disabled]{opacity:.35;pointer-events:none}
label.f{display:block;font-weight:500;margin:16px 0 8px}
.hint{color:var(--muted);font-size:.92rem;margin:-2px 0 10px}
input[type=text],input[type=password],textarea,select{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:16px;background:var(--raised);
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease);-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:130px;resize:vertical;line-height:1.55}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 55%,calc(100% - 16px) 55%;background-size:6px 6px;background-repeat:no-repeat}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p),var(--soft) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--raised);margin-top:-11px;box-shadow:0 0 0 2px var(--accent),0 6px 14px -4px rgba(74,38,20,.4);transition:transform .2s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--soft)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:var(--raised);box-shadow:0 0 0 2px var(--accent),0 6px 14px -4px rgba(74,38,20,.4)}
.scale{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted)}
.bignum{font-family:var(--serif);font-size:4.2rem;line-height:1;text-align:center;margin:18px 0 8px;font-variant-numeric:tabular-nums}
.bignum small{font-size:1rem;color:var(--muted)}

/* chips & options */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-size:.95rem;
  transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),transform .22s var(--spring)}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chip:active{transform:scale(.93)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:18px;padding:15px 18px;box-shadow:var(--shadow-sm);
  transition:border-color .25s var(--ease),transform .22s var(--spring),background .25s var(--ease)}
.opt::before{content:"";width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;transition:border-color .25s,background .25s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.opt[aria-pressed="true"]::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 5px,transparent 5.5px)}
.toggle{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--soft);position:relative;cursor:pointer;flex:none;transition:background .25s var(--ease);border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--raised);box-shadow:var(--shadow-sm);transition:transform .3s var(--spring)}
.toggle:checked{background:var(--accent);border-color:var(--accent)}
.toggle:checked::after{transform:translateX(18px)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}

.muted{color:var(--muted)} .small{font-size:.88rem}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:24px;color:var(--muted);text-align:center}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,14px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:.93rem;z-index:90;max-width:90vw;box-shadow:var(--shadow-lg);animation:toast-in .4s var(--spring) both;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translate(-50%,8px)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:rgba(27,22,20,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;animation:fadein .25s ease both}
.modal .panel{max-width:440px;width:100%;margin:0;animation:popin .35s var(--spring) both;box-shadow:var(--shadow-lg)}

/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:0 0 28px}
.greet{font-size:clamp(2rem,5vw,2.9rem);margin:0 0 .3em;letter-spacing:-.015em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;font-weight:500;line-height:1.2}
.stat span{color:var(--muted);font-size:.86rem}
.task{border-left:4px solid var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 4px;box-sizing:border-box;border-radius:12px;transition:background .25s var(--ease),padding .25s var(--ease)}
.list button:hover{background:var(--raised);padding-left:10px;padding-right:10px}
.list .d{color:var(--muted);font-size:.86rem;white-space:nowrap}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:10px;height:14px;border-radius:3px;display:block}

/* wizard */
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.wch{color:var(--muted);font-size:.92rem}
.prog{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s var(--ease)}
.q{font-family:var(--serif);font-weight:500;font-size:clamp(1.65rem,3.6vw,2.25rem);line-height:1.18;margin:24px 0 12px;letter-spacing:-.01em}
.wnext{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:28px}
.practice{background:var(--soft);border-radius:20px;padding:20px 22px;margin:14px 0}
.practice ol{margin:.5em 0 0;padding-left:1.2em}
.practice li{margin:.35em 0}
.tabs{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.crisis{margin-top:22px;font-size:.88rem;color:var(--muted)}

/* colour test */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:500px;margin:22px auto}
.sw{aspect-ratio:1;border-radius:22px;border:0;cursor:pointer;box-shadow:0 14px 26px -16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .28s var(--spring),opacity .22s ease}
.sw:hover{transform:translateY(-2px) scale(1.02)}
.sw:active{transform:scale(.92)}
.sw.pop{transform:scale(.55);opacity:0}
.sw.gone{visibility:hidden}
.picked{display:flex;gap:6px;justify-content:center;min-height:30px;margin-top:6px}
.picked i{width:28px;height:28px;border-radius:8px;display:block;box-shadow:var(--shadow-sm)}
.picked i:last-child{animation:popin .35s var(--spring) both}
.probe-count{text-align:center;color:var(--muted);font-size:.9rem}
.order{display:flex;gap:5px;margin:10px 0}
.order div{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.order div i{display:block;height:38px;border-radius:10px;margin-bottom:4px}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:4px;animation:grow .9s var(--ease) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.val{font-family:var(--serif);font-size:1.8rem;line-height:1.3}
.bars .b{display:grid;grid-template-columns:180px 1fr 34px;gap:12px;align-items:center;margin:9px 0;font-size:.93rem}
@media (max-width:620px){.bars .b{grid-template-columns:110px 1fr 28px}}
.bars .b.max .meter i{background:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t td,table.t th{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}

/* practices */
details.m{border-top:1px solid var(--line);padding:13px 2px}
details.m summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.m summary::-webkit-details-marker{display:none}
details.m summary::after{content:"";width:9px;height:9px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .3s var(--ease);flex:none;margin-left:8px}
details.m[open] summary::after{transform:rotate(-135deg)}
details.m summary .code{color:var(--muted);font-size:.84rem;white-space:nowrap;margin-left:auto}
details.m[open]>:not(summary){animation:in-fade .35s var(--ease) both}
details.m[open] summary{margin-bottom:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:.95rem;margin:0}
@media (max-width:620px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.breath{height:190px;display:grid;place-items:center}
.ball{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-hi),var(--accent));box-shadow:0 20px 40px -18px color-mix(in srgb,var(--accent) 80%,transparent);transform:scale(.55)}
.rx-t{font-family:var(--serif);font-size:1.6rem;text-align:center;font-variant-numeric:tabular-nums}

/* auth, welcome */
.auth{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 20px}
.auth .mark{margin-bottom:22px}
.boot{height:100%;display:grid;place-items:center}
.boot svg{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.92);opacity:.75}}
.welcome{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.welcome.out{opacity:0;transform:scale(1.03);pointer-events:none}
.welcome .mark{animation:wmark 1s var(--spring) both;margin-bottom:28px;display:inline-block}
@keyframes wmark{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.welcome .g1{font-family:var(--serif);font-size:clamp(1.3rem,3.4vw,1.7rem);color:var(--muted);margin:0 0 4px;animation:rise .8s .25s var(--ease) both}
.welcome .g2{font-size:clamp(2.6rem,8vw,4.2rem);margin:0 0 14px;animation:rise .8s .38s var(--ease) both}
.welcome .g3{color:var(--muted);animation:rise .8s .55s var(--ease) both}
.welcome .tap{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:.86rem;color:var(--muted);animation:fadein .8s 1.4s both}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:999px;padding:4px;margin:14px 0 8px}
.seg button{white-space:nowrap;cursor:pointer;border:0;background:transparent;border-radius:999px;padding:10px 12px;font-size:.93rem;color:var(--muted);transition:background .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease),transform .2s var(--spring)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-sm)}
.grid2>.panel{display:flex;flex-direction:column}
.grid2>.panel>.btn{margin-top:auto;align-self:flex-start}
.ball{background:radial-gradient(circle at 35% 30%,#E0584B,var(--accent) 70%)}

/* --- выравнивание 1.1.1 --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:1px solid transparent;text-align:center;vertical-align:middle}
.btn.small{min-height:38px;padding:0 16px}
.btn.quiet{border-color:var(--line)}
.btn.link{padding:0 12px}
.btn.danger{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
input[type=text],input[type=password],select{min-height:48px;padding-top:0;padding-bottom:0;line-height:46px}
select{line-height:normal}
input[type=range]{margin:0;display:block}
.row>input[type=text]{flex:1;min-width:0}
.bignum .bn{position:relative;display:inline-block}
.bignum .bn small{position:absolute;left:100%;bottom:.62em;margin-left:8px;white-space:nowrap;font-family:var(--sans);font-size:.95rem;line-height:1}
.hint[id="a-err"]{margin:8px 0 6px;min-height:1.4em}
.switchrow>span{flex:1}
.list button>span:first-child{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
@media (max-width:620px){
  .bars .b{grid-template-columns:1fr 30px;row-gap:5px;margin:12px 0}
  .bars .b>span:first-child{grid-column:1/-1}
  .bars .b>span:last-child{text-align:right}
}
@media (max-width:520px){
  .acts{flex-direction:column;align-items:stretch}
  .acts>.btn{width:100%}
}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.chip{border-radius:20px;max-width:100%;text-align:left}
@media (max-width:360px){.stats{gap:8px}.stat{padding:14px 12px}.stat span{font-size:.8rem}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return "x"+h}}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SS={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
function setP(el){const min=+el.min||0,max=+el.max||10;el.style.setProperty("--p",((+el.value-min)/(max-min)*100)+"%")}

/* ---------- анализ цветового выбора ---------- */
function analyze(order){
  const pos={};order.forEach((c,i)=>pos[c]=i+1);
  let so=0;for(const c of order)so+=Math.abs(pos[c]-(NORM.indexOf(c)+1));
  let anx=0;
  for(const c of [1,2,3,4]){const p=pos[c];if(p===6)anx+=1;if(p===7)anx+=2;if(p===8)anx+=3}
  for(const c of [0,6,7]){const p=pos[c];if(p===3)anx+=1;if(p===2)anx+=2;if(p===1)anx+=3}
  const vk=(18-pos[3]-pos[4])/(18-pos[1]-pos[2]);
  return {so,anx,vk:Math.round(vk*100)/100};
}
const soText=so=>so<=10?"эмоциональный фон ровный, благоприятный":so<=18?"умеренное напряжение":"выраженное напряжение";
const anxText=a=>a===0?"тревога не выражена":a<=3?"небольшая тревога":a<=5?"заметная тревога":"выраженная тревога";
const vkText=v=>v<0.9?"организм просит восстановления и покоя":v<=1.1?"баланс между активностью и отдыхом":"мобилизация, возбуждение, установка на действие";

const KINDS=["sessions","tests","notes"];
const S={mode:null,userName:"",pid:null,db:null,uid:null,data:{sessions:[],tests:[],notes:[]},profile:{code:""},view:"home",param:null,wiz:null,ct:null,relax:null,diaryType:"episode",df:null};
const skey=()=>S.mode==="cloud"?"c-"+S.uid:S.pid;
const Store={
  base(){return S.db.doc(`data/users/${S.uid}/profile`)},
  async load(){
    if(S.mode==="cloud"){
      const [p,...cols]=await Promise.all([this.base().get(),...KINDS.map(k=>this.base().collection(k).get())]);
      if(p.exists)S.profile=Object.assign({code:""},p.data());
      KINDS.forEach((k,i)=>S.data[k]=cols[i].docs.map(d=>d.data()));
    }else{
      KINDS.forEach(k=>S.data[k]=LS.get(`tochka:${S.pid}:${k}`,[]));
      S.profile=LS.get(`tochka:${S.pid}:profile`,{code:""});
    }
    KINDS.forEach(k=>S.data[k].sort((a,b)=>b.createdAt-a.createdAt));
    S.wiz=LS.get(`tochka:${skey()}:draft`,null);
  },
  async put(kind,obj){
    const arr=S.data[kind];const i=arr.findIndex(x=>x.id===obj.id);
    if(i>=0)arr[i]=obj;else arr.unshift(obj);
    arr.sort((a,b)=>b.createdAt-a.createdAt);
    try{
      if(S.mode==="cloud")await this.base().collection(kind).doc(obj.id).set(obj);
      else if(!LS.set(`tochka:${S.pid}:${kind}`,arr))throw new Error("ls");
    }catch(e){toast("Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.")}
  },
  async del(kind,id){
    S.data[kind]=S.data[kind].filter(x=>x.id!==id);
    try{
      if(S.mode==="cloud")await this.base().collection(kind).doc(id).delete();
      else LS.set(`tochka:${S.pid}:${kind}`,S.data[kind]);
    }catch(e){toast("Не удалось удалить запись.")}
  },
  async saveProfile(){
    try{if(S.mode==="cloud")await this.base().set(S.profile);else LS.set(`tochka:${S.pid}:profile`,S.profile)}
    catch(e){toast("Не удалось сохранить профиль.")}
  },
  async wipe(){for(const k of KINDS)for(const x of [...S.data[k]])await Store.del(k,x.id)}
};

const authErr=t=>{const e=document.getElementById("a-err");if(e)e.textContent=t;buzz()};
async function doRegister(){
  const name=document.getElementById("a-name").value.trim(),pin=document.getElementById("a-pin").value.trim(),pin2=document.getElementById("a-pin2").value.trim();
  if(!name)return authErr("Напишите, как к вам обращаться.");
  if(!/^\d{4,8}$/.test(pin))return authErr("PIN — от 4 до 8 цифр.");
  if(pin!==pin2)return authErr("PIN-коды не совпадают.");
  const profs=LS.get("tochka:profiles",[]);const salt=uid();
  const p={id:uid(),name,salt,hash:await sha(salt+pin),askPin:false};
  profs.push(p);if(!LS.set("tochka:profiles",profs))return authErr("Браузер не даёт сохранить данные. Проверьте настройки приватности.");
  await enterLocal(p,true);
}
async function checkPin(p,pin){return p&&await sha(p.salt+pin)===p.hash}
async function doLogin(){
  const id=document.getElementById("a-who").value,pin=document.getElementById("a-pin").value.trim();
  const p=LS.get("tochka:profiles",[]).find(x=>x.id===id);
  if(!await checkPin(p,pin))return authErr("PIN не подходит.");
  await enterLocal(p);
}
async function doPinLogin(){
  const pin=document.getElementById("a-pin").value.trim();
  if(!await checkPin(S.pinFor,pin))return authErr("PIN не подходит.");
  const p=S.pinFor;S.pinFor=null;await enterLocal(p);
}
async function enterLocal(p,first){
  S.mode="local";S.pid=p.id;S.userName=p.name;S.view="home";
  LS.set("tochka:last",p.id);
  await Store.load();
  showWelcome(first);

}

async function ctPick(c,el){

  ct.results.push({title:PROBES[ct.mode][ct.idx].t,order:[...ct.cur],res:analyze(ct.cur)});

  [...S.data.tests].reverse().forEach(t=>t.probes.forEach(p=>rows.push([t.code||S.profile.code||"",new Date(t.createdAt).toLocaleString("ru-RU"),t.mode==="full"?"полный":"быстрый",p.title,...p.order,p.res.so,p.res.anx,String(p.res.vk).replace(".",",")])));
  return "\uFEFF"+rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(";")).join("\r\n");
}

async function download(name,data){
  if(window.claude&&window.claude.use){
    const dl=await window.claude.use("downloads");
    if(!dl){toast("Скачивание недоступно в этом окне.");return}
    try{await dl.save({filename:name,data})}catch(e){if(e&&e.code!=="declined")toast("Не удалось сохранить файл.")}
    return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- дневник ---------- */
function dayIdx(t,now,days){const d=new Date(t);d.setHours(0,0,0,0);return days-1-Math.round((now-d)/DAY)}
function epChart(eps){
  const days=14,now=new Date();now.setHours(0,0,0,0);const cnt=Array(days).fill(0);
  eps.forEach(e=>{const i=dayIdx(e.createdAt,now,days);if(i>=0&&i<days)cnt[i]++});
  const mx=Math.max(3,...cnt),W=680,H=130,bw=W/days;
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Эпизоды за 14 дней">
  ${cnt.map((c,i)=>`<rect x="${i*bw+6}" y="${H-c/mx*H}" width="${bw-12}" height="${c/mx*H}" rx="6" fill="var(--accent)"/>${c?`<text x="${i*bw+bw/2}" y="${H-c/mx*H-6}" font-size="13" text-anchor="middle" fill="var(--muted)">${c}</text>`:""}`).join("")}
  <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
  <text x="2" y="${H+18}" font-size="13" fill="var(--muted)">14 дней назад</text><text x="${W-2}" y="${H+18}" font-size="13" fill="var(--muted)" text-anchor="end">сегодня</text></svg></div>`;
}
function wbChart(notes){
  const days=14,now=new Date();now.setHours(0,0,0,0);const sum=Array(days).fill(0),n=Array(days).fill(0);
  notes.forEach(e=>{if(e.wellbeing==null)return;const i=dayIdx(e.createdAt,now,days);if(i>=0&&i<days){sum[i]+=e.wellbeing;n[i]++}});
  const W=680,H=130,bw=W/days;
  const pts=sum.map((s,i)=>n[i]?[i*bw+bw/2,H-(s/n[i])/10*H]:null);
  const path=pts.filter(Boolean).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Самочувствие за 14 дней">
  <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="3 5"/><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
  ${path?`<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:""}
  ${pts.map(p=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>`:"").join("")}
  <text x="2" y="${H+18}" font-size="13" fill="var(--muted)">14 дней назад</text><text x="${W-2}" y="${H+18}" font-size="13" fill="var(--muted)" text-anchor="end">сегодня</text></svg></div>`;
}

let rxTimer=null;
function relaxStart(){S.relax={i:0,phase:"tense",left:5};render()}
function relaxStop(){clearInterval(rxTimer);rxTimer=null;S.relax=null;render()}
function relaxPaint(){
  const r=S.relax;if(!r)return;
  const ball=document.getElementById("rx-ball"),ph=document.getElementById("rx-phase");
  const $=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  $("rx-n",`${r.i+1} из ${RELAX.length}`);$("rx-name",RELAX[r.i]);$("rx-t",r.left);
  if(ph)ph.textContent=r.phase==="tense"?"Вдох. Напрягите мышцы и удерживайте…":"Выдох. Отпустите и почувствуйте, как уходит напряжение.";
  if(ball&&ball.dataset.p!==r.phase){ball.dataset.p=r.phase;const d=r.phase==="tense"?5:12;ball.style.transition=`transform ${d}s cubic-bezier(.45,.05,.35,1)`;requestAnimationFrame(()=>{ball.style.transform=r.phase==="tense"?"scale(1)":"scale(.55)"})}
}
function relaxLoop(){
  clearInterval(rxTimer);relaxPaint();
  rxTimer=setInterval(()=>{
    const r=S.relax;if(!r||S.view!=="practices"){clearInterval(rxTimer);rxTimer=null;return}
    r.left--;
    if(r.left<=0){
      if(r.phase==="tense"){r.phase="relax";r.left=12}
      else if(r.i+1<RELAX.length){r.i++;r.phase="tense";r.left=5;buzz()}
      else{clearInterval(rxTimer);rxTimer=null;S.relax=null;toast("Релаксация завершена. Побудьте в этом состоянии ещё немного.");render();return}
    }
    relaxPaint();
  },1000);
}

    case "relaxStop":return relaxStop();
    case "saveCode":S.profile.code=document.getElementById("p-code").value.trim();await Store.saveProfile();return toast("Код сохранён.");
    case "wipe":if(await ask("Удалить все разборы, тесты и записи дневника? Это действие нельзя отменить.",{ok:"Удалить всё"})){await Store.wipe();toast("Все записи удалены.");go("home")}return;
  }
});
function captureDiary(){const o={};["d-text"].forEach(k=>{const el=document.getElementById(k);if(el)o[k]=el.value});return o}
function restoreDiary(o){for(const k in o){const el=document.getElementById(k);if(el)el.value=o[k]}}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.type==="range")setP(el);
  if(el.dataset.bind&&S.wiz){const k=el.dataset.bind;S.wiz[k]=el.dataset.num?+el.value:el.value;const o=document.getElementById("v-"+k);if(o)o.textContent=el.value;refreshNextLabel();saveDraft()}
  if(el.dataset.dbind&&S.df){const k=el.dataset.dbind;S.df[k]=+el.value;const o=document.getElementById({before:"v-dbefore",after:"v-dafter",wellbeing:"v-dwb"}[k]);if(o)o.textContent=el.value}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="d-done"&&S.df){S.df.done=el.checked;buzz()}
  if(el.id==="p-askpin"){const profs=LS.get("tochka:profiles",[]);const p=profs.find(x=>x.id===S.pid);if(p){p.askPin=el.checked;LS.set("tochka:profiles",profs);buzz();toast(el.checked?"Теперь при входе будет нужен PIN.":"Профиль будет открываться сразу.")}}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.target.closest(".modal"))return;
  const t=e.target;
  if(!S.mode&&t.tagName==="INPUT"){e.preventDefault();const b=document.querySelector('[data-a="pinLogin"],[data-a="login"],[data-a="register"]');if(b)b.click();return}
  if(S.view==="wizard"&&S.wiz){
    if(t.tagName==="INPUT"&&t.type==="text"){e.preventDefault();WS[S.wiz.step].type==="summary"?saveWiz():wnext()}
    else if(t.tagName==="TEXTAREA"&&(e.metaKey||e.ctrlKey)){e.preventDefault();wnext()}
  }
});

/* ---------- запуск ---------- */
async function boot(){
  root.innerHTML=`<div class="boot">${KEYHOLE(64)}</div>`;
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  }
  if(db&&user){
    const me=await user.me();
    if(me&&me.id){
      S.mode="cloud";S.db=db;S.uid=me.id;S.userName=me.name||"";
      try{await Store.load()}catch(e){toast("Не удалось загрузить записи. Обновите страницу.")}
      showWelcome();render("fade");return;
    }
  }
  const last=LS.get("tochka:last",null);
  const p=last&&LS.get("tochka:profiles",[]).find(x=>x.id===last);
  if(p){if(p.askPin){S.pinFor=p;render("fade")}else await enterLocal(p)}
  else render("fade");
}
boot();
</script>
